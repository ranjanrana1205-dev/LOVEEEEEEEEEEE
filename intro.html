<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#291a31">
    <meta name="description" content="A little cupid, one arrow, and the beginning of our anniversary story.">
    <title>Our Story ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="intro.css">
    <script src="intro.js" defer></script>
</head>
<body>
    <main class="scene" id="scene">
        <div class="stars" aria-hidden="true">
            <span>✦</span><span>·</span><span>✧</span><span>·</span><span>✦</span><span>·</span>
            <span>✧</span><span>·</span><span>✦</span><span>·</span><span>✧</span><span>✦</span>
        </div>
        <div class="glow glow-1" aria-hidden="true"></div>
        <div class="glow glow-2" aria-hidden="true"></div>

        <p class="top-label"><span></span>A little cupid is on his way<span></span></p>
        <h1>Love is in the <i>air.</i></h1>
        <p class="subtitle">A little magic, one arrow, and a story waiting to begin.</p>

        <section class="stage" aria-label="A cupid boy aims an arrow at a glowing heart">
            <div class="moon-glow" aria-hidden="true"></div>

            <div class="cupid" aria-hidden="true">
                <div class="character-shadow"></div>
                <div class="leg leg-left"><span class="shoe"></span></div>
                <div class="leg leg-right"><span class="shoe"></span></div>
                <div class="body">
                    <span class="sweater-light"></span>
                    <span class="collar"></span>
                    <span class="heart-mark">♡</span>
                </div>
                <div class="neck"></div>
                <div class="head">
                    <span class="ear left-ear"></span>
                    <span class="ear right-ear"></span>
                    <span class="hair"><span class="hair-shine"></span></span>
                    <span class="eyebrow left"></span>
                    <span class="eyebrow right"></span>
                    <span class="eye left-eye"></span>
                    <span class="eye right-eye"></span>
                    <span class="nose"></span>
                    <span class="smile"></span>
                    <span class="cheek left-cheek"></span>
                    <span class="cheek right-cheek"></span>
                </div>
                <span class="arm-back"></span>
                <span class="arm-front"></span>
                <span class="hand hand-string"></span>
                <span class="hand hand-bow"><i></i><i></i><i></i></span>
            </div>

            <div class="bow" aria-hidden="true">
                <span class="bow-shape"></span>
                <span class="bow-string"></span>
            </div>
            <div class="arrow" aria-hidden="true">
                <span class="arrow-shaft"></span>
                <span class="arrow-head"></span>
                <span class="arrow-feather"></span>
            </div>

            <div class="target" aria-hidden="true">
                <span class="target-ring ring-1"></span>
                <span class="target-ring ring-2"></span>
                <span class="target-ring ring-3"></span>
                <span class="heart"><i></i></span>
            </div>
        </section>

        <div class="bottom-text" aria-live="polite">
            <div class="loading-line" aria-hidden="true"><span></span></div>
            <p id="intro-status">Drawing back…</p>
        </div>
        <button class="enter-story" id="startBtn" type="button" hidden>Enter our story <b aria-hidden="true">→</b></button>
        <a class="skip-intro" href="index.html?introComplete=1">Skip to our anniversary <span aria-hidden="true">→</span></a>
    </main>
</body>
</html>
